[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repomix-static-reconstructor"
version = "0.1.0"
description = "Reconstruct static file trees from Repomix exports without running recovered code"
readme = "README.md"
requires-python = ">=3.10"
# License selection is a P0-07 release gate; pyproject gains a `license`
# expression once LICENSE is added. Not public-distributable before then.
authors = [{ name = "darizae" }]
keywords = ["repomix", "unmix", "unpack", "static", "offline", "repository", "export"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/darizae/repomix-static-reconstructor"
Repository = "https://github.com/darizae/repomix-static-reconstructor"
Issues = "https://github.com/darizae/repomix-static-reconstructor/issues"
Changelog = "https://github.com/darizae/repomix-static-reconstructor/blob/main/CHANGELOG.md"

[project.scripts]
unmix-repomix = "repomix_static_reconstructor.extractor:main"
reconstruct-all = "repomix_static_reconstructor.batch:main"

[project.optional-dependencies]
dev = ["build", "twine"]

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["repomix_static_reconstructor"]

[tool.setuptools.package-data]
repomix_static_reconstructor = ["py.typed"]
