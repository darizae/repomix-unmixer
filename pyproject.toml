[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repomix-unmixer"
version = "0.1.0"
description = "Reconstruct static file trees from Repomix exports without running recovered code"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "darizae" }]
keywords = ["repomix", "unmix", "unpack", "static", "offline", "repository", "export"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/darizae/repomix-unmixer"
Repository = "https://github.com/darizae/repomix-unmixer"
Issues = "https://github.com/darizae/repomix-unmixer/issues"

[project.scripts]
unmix-repomix = "repomix_unmixer.extractor:main"
reconstruct-all = "repomix_unmixer.batch:main"

[project.optional-dependencies]
dev = ["build", "twine"]

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["repomix_unmixer"]

[tool.setuptools.package-data]
repomix_unmixer = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# Explicit selection, not default evolution: CI results stay stable across ruff
# releases. Extend this list deliberately when adopting new rule families.
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
    "PIE",    # flake8-pie
    "PLW",    # pylint warnings
    "EXE",    # flake8-executable
]
ignore = [
    # Tests insert sys.path before package imports by design.
    "E402",
    # Deliberate: subprocess return codes are asserted by hand for diagnostics.
    "PLW1510",
]

[tool.ruff.lint.per-file-ignores]
# package __init__ re-exports intentionally grouped by module of origin
"src/repomix_unmixer/__init__.py" = ["I001", "RUF022"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disable_error_code = ["no-untyped-def"]
